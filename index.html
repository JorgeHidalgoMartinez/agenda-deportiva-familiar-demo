'use strict';const $=s=>document.querySelector(s),seed=JSON.parse($('#seed').textContent),KEY=READONLY?'agenda-demo-family-v11':'agenda-demo-private-v11';let scope='family';let db=JSON.parse(JSON.stringify(seed)),storageOK=true;

function valid(x){return x&&x.version===1&&Array.isArray(x.people)&&Array.isArray(x.events)&&x.people.length<=1000&&x.events.length<=20000&&x.people.every(p=>p&&typeof p.id==='string'&&typeof p.name==='string'&&typeof p.team==='string'&&Object.keys(sports).includes(p.sport)&&[1,2,3].includes(p.priority)&&typeof p.active==='boolean'&&['family','friends'].includes(p.group))&&new Set(x.people.map(p=>p.id)).size===x.people.length&&x.events.every(e=>e&&typeof e.id==='string'&&x.people.some(p=>p.id===e.person)&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)&&!isNaN(parseDate(e.date))&&(!e.time||/^([01]\d|2[0-3]):[0-5]\d$/.test(e.time))&&typeof e.match==='string'&&['Presencial','Online'].includes(e.mode)&&Object.hasOwn(statuses,e.status)&&Object.hasOwn(attendance,e.attend))&&new Set(x.events.map(e=>e.id)).size===x.events.length}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function safe(x){try{const u=new URL(x);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}function link(url,label){const u=safe(url);return u?`<a class="btn slim" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(label)} ↗</a>`:''}function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function parseDate(s){return new Date(s+'T12:00:00')}function shift(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}function friday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);const day=x.getDay();return shift(x,day===0?-2:5-day)}function fmt(d,o){return d.toLocaleDateString('es-ES',o)}function person(id){return db.people.find(p=>p.id===id)}function uid(){return globalThis.crypto?.randomUUID?.()||'id-'+Date.now()+'-'+Math.random().toString(36).slice(2)}function save(){try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true;$('#storageAlert').classList.add('hidden')}catch{storageOK=false;$('#storageAlert').classList.remove('hidden')}render()}function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3000)}function selectTab(t){tab=t;document.querySelectorAll('main section').forEach(s=>s.classList.toggle('hidden',s.id!==t));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function inScope(p){return p?.group===scope}function getEvents(){const start=dateKey(shift(week,weekAll?-4:0)),end=dateKey(shift(week,2));return db.events.filter(e=>e.date>=start&&e.date<=end&&inScope(person(e.person))).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'99:99').localeCompare(b.time||'99:99')||(person(a.person)?.priority||9)-(person(b.person)?.priority||9))}
function renderAgenda(){const all=getEvents(),active=db.people.filter(p=>p.active&&inScope(p)),visible=all.filter(e=>(sport==='Todos'||person(e.person)?.sport===sport)&&(!onlyGoing||e.attend==='si'));const missing=active.filter(p=>!all.some(e=>e.person===p.id)&&(sport==='Todos'||p.sport===sport));let html=`<div class="panel"><div class="week"><button class="btn arrow" data-act="prev" aria-label="Fin de semana anterior">‹</button><div><small>${weekAll?'SEMANA COMPLETA':'FIN DE SEMANA'}</small><h2>${esc(fmt(shift(week,weekAll?-4:0),{day:'numeric',month:'short'}))} – ${esc(fmt(shift(week,2),{day:'numeric',month:'short'}))}</h2><small>${week.getFullYear()}</small></div><button class="btn arrow" data-act="next" aria-label="Fin de semana siguiente">›</button></div><div class="bar"><button class="btn slim" data-act="today">Este fin de semana</button><button class="btn slim" data-act="week">${weekAll?'Solo viernes–domingo':'Ver semana completa'}</button><span class="spacer"></span><button class="btn primary" data-act="new-event">+ Partido</button></div><div class="filters">${['Todos',...Object.keys(sports)].map(s=>`<button class="chip ${sport===s?'active':''}" data-sport="${esc(s)}">${esc(s)}</button>`).join('')}</div><div class="bar"><button class="chip ${onlyGoing?'active':''}" data-act="going">${onlyGoing?'✓ ':''}Solo los que voy a ver</button></div></div><div class="summary"><div class="metric"><b>${all.length}</b>Encuentros</div>${READONLY?'':`<div class="metric"><b>${all.filter(e=>e.attend==='si').length}</b>Seleccionados</div>`}<div class="metric"><b>${active.filter(p=>!all.some(e=>e.person===p.id)).length}</b>Sin horario registrado</div></div>`;let last='';for(const e of visible){const p=person(e.person);if(!p)continue;if(last!==e.date){last=e.date;html+=`<div class="day">${esc(fmt(parseDate(e.date),{weekday:'long',day:'numeric',month:'long'}))}</div>`}const [emoji,cls]=sports[p.sport]||sports.Otro;const url=e.link||(e.mode==='Online'?p.stream:'');html+=`<article class="event ${cls}"><div class="time">${esc(e.time||'—')}<small>${e.time?'hora España':'sin hora'}</small></div><div><h3>${emoji} ${esc(p.name)} ${p.priority===1?'<span class="tag">Prioridad alta</span>':''}</h3><p class="match">${esc(e.match)}</p><p class="muted">${esc(e.place||(e.mode==='Online'?'Retransmisión online':'Lugar sin dato'))}</p><p><span class="tag ${e.status==='confirmado'?'ok':e.status==='pendiente'?'warn':'no'}">${e.source==='Calendario de equipo'?'Horario de fuente pública · verificar':statuses[e.status]}</span> ${READONLY?'':`<span class="tag ${e.attend==='si'?'ok':e.attend==='no'?'no':''}">${attendance[e.attend]}</span>`}</p>${e.notes?`<details class="event-note"><summary>Notas del horario</summary><p class="muted">${esc(e.notes)}</p></details>`:''}<div class="event-actions"><button class="btn slim ${e.attend==='si'?'primary':''}" data-act="attend" data-id="${esc(e.id)}">${e.attend==='si'?'✓ Voy':'Marcar que voy'}</button>${link(url,e.mode==='Online'?'Ver online':'Ubicación')}<button class="btn slim" data-act="edit-event" data-id="${esc(e.id)}">Editar</button></div></div></article>`}if(!visible.length)html+='<div class="panel empty">No hay partidos registrados con estos filtros.</div>';if(missing.length&&!onlyGoing)html+=`<div class="pending"><h3>Seguimientos sin partido registrado</h3><p>No significa que no jueguen: todavía no hay datos para estas fechas.</p>${missing.map(p=>`<p>${sports[p.sport]?.[0]||'🏅'} <b>${esc(p.name)}</b> · ${esc(p.team)} <button class="btn slim" data-act="new-for" data-id="${esc(p.id)}">+ Añadir</button></p>`).join('')}</div>`;$('#agenda').innerHTML=html}
function renderPeople(){let html=`<div class="section-head"><h2>${scope==='friends'?'Amigos':'Familia'}</h2><button class="btn primary" data-act="new-person">+ Añadir</button></div><p class="note">Puedes cambiar los datos y archivar un seguimiento sin perder su historial.</p>`;for(const p of db.people.filter(inScope).sort((a,b)=>Number(b.active)-Number(a.active)||a.priority-b.priority)){html+=`<div class="panel person"><div class="emoji">${sports[p.sport]?.[0]||'🏅'}</div><div class="details"><h3>${esc(p.name)} ${!p.active?'<span class="tag">Archivado</span>':''}</h3><p>${esc(p.team)} · ${esc(p.sport)}</p><p>${esc(p.category||'')} · Prioridad ${['','alta','normal','baja'][p.priority]}</p><div class="bar">${link(p.source,'Competición')}${link(p.stream,'Retransmisión')}</div></div><button class="btn slim" data-act="edit-person" data-id="${esc(p.id)}">Editar</button></div>`}$('#people').innerHTML=html}
function renderSettings(){$('#settings').innerHTML=`<div class="section-head"><h2>Ajustes y datos</h2></div><div class="panel settings"><h3>Datos de la agenda</h3><p>${db.people.length} seguimientos · ${db.events.length} encuentros anotados.</p><p>Origen: ${esc(db.importedFrom||'Entrada manual')}. Hay una integración de prueba de fútbol con datos ficticios; no hay conexión federativa real en esta demo.</p><p>La copia JSON completa contiene tanto familia como amigos: no la compartas como agenda familiar.</p><p>Se guardan en este navegador y dispositivo; no se sincronizan con otros teléfonos. Exporta una copia para conservarlos o transferirlos.</p><div class="bar"><button class="btn primary" data-act="export">Exportar copia JSON</button><button class="btn" data-act="import">Importar copia JSON</button></div></div><div class="panel settings"><h3>Instalación y privacidad</h3><p>Esta versión funciona sin enviar datos a ningún servidor. Los enlaces externos se abren solo si los pulsas. La instalación como PWA necesita servir los archivos del paquete por HTTPS o localhost.</p><p>La vista familiar distribuible es un archivo separado, sin los datos de amigos. No se sincroniza con esta edición.</p><p>Los horarios importados no están verificados con las federaciones. No es una agenda en tiempo real.</p></div><div class="panel settings"><h3>Restaurar datos iniciales</h3><p>Elimina los cambios locales y vuelve a los datos de partida. Exporta antes una copia.</p><button class="btn danger" data-act="reset">Restaurar</button></div>`}
function render(){document.querySelectorAll('[data-scope]').forEach(b=>{b.classList.toggle('active',b.dataset.scope===scope);b.setAttribute('aria-pressed',String(b.dataset.scope===scope))});$('#scopeNote').textContent=scope==='friends'?'Seguimiento personal · no incluido en la vista familiar':'Calendario de hijos, sobrinas y familia';if(tab==='agenda')renderAgenda();else if(tab==='people')renderPeople();else renderSettings();if(READONLY)document.querySelectorAll('[data-act="new-event"],[data-act="new-for"],[data-act="edit-event"],[data-act="attend"],[data-act="going"],[data-act="new-person"],[data-act="edit-person"]').forEach(b=>b.remove())}function fill(form,obj){form.reset();for(const [k,v] of Object.entries(obj)){const el=form.elements.namedItem(k);if(el)el.value=String(v??'')}}function openEvent(id,pid){const old=db.events.find(e=>e.id===id),f=$('#eventForm');if(!db.people.length){toast('Añade primero un deportista');selectTab('people');return}$('#ep').innerHTML=db.people.filter(p=>inScope(p)&&(p.active||p.id===old?.person)).map(p=>`<option value="${esc(p.id)}">${esc(p.name)} · ${esc(p.team)}</option>`).join('');if(!$('#ep').options.length){toast('Activa un seguimiento');selectTab('people');return}fill(f,old||{id:'',person:pid||$('#ep').options[0].value,date:dateKey(week),mode:'Presencial',status:'pendiente',attend:'sin_decidir'});$('#eventTitle').textContent=old?'Editar partido':'Nuevo partido';$('#deleteEvent').classList.toggle('hidden',!old);$('#eventDialog').showModal()}function openPerson(id){const p=person(id);fill($('#personForm'),p||{id:'',sport:'Fútbol',priority:2,active:true,group:scope});$('#personTitle').textContent=p?'Editar seguimiento':'Nuevo seguimiento';$('#personDialog').showModal()}
$('#eventForm').addEventListener('submit',e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),old=db.events.find(x=>x.id===f.id);if(!person(f.person))return;const v={...old,...f,id:f.id||uid(),source:old?.source||'Manual'};if(old)db.events[db.events.indexOf(old)]=v;else db.events.push(v);week=friday(parseDate(v.date));if(parseDate(v.date).getDay()>0&&parseDate(v.date).getDay()<5)weekAll=true;$('#eventDialog').close();save();toast('Partido guardado')});$('#personForm').addEventListener('submit',e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),old=person(f.id),v={...old,...f,id:f.id||uid(),priority:Number(f.priority),active:f.active==='true'};if(old)db.people[db.people.indexOf(old)]=v;else db.people.push(v);$('#personDialog').close();save();toast('Seguimiento guardado')});$('#deleteEvent').addEventListener('click',()=>{if(confirm('¿Eliminar este partido?')){const id=$('#eventForm').elements.namedItem('id').value;db.events=db.events.filter(e=>e.id!==id);$('#eventDialog').close();save();toast('Partido eliminado')}});
function download(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='agenda-deportiva-'+dateKey(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10e6)throw Error('Archivo demasiado grande');const v=JSON.parse(await file.text());if(!valid(v))throw Error('Formato de agenda no válido');if(confirm('La copia sustituirá todos los datos locales. ¿Continuar?')){db=v;save();toast('Copia importada')}}catch(err){alert('No se ha importado: '+err.message)}finally{e.target.value=''}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.scope&&!READONLY){scope=b.dataset.scope;sport='Todos';onlyGoing=false;return render()}if(b.dataset.tab)return selectTab(b.dataset.tab);if(b.dataset.close)return document.getElementById(b.dataset.close).close();if(b.dataset.sport){sport=b.dataset.sport;return render()}const a=b.dataset.act,id=b.dataset.id;if(READONLY&&!['prev','next','today','week'].includes(a))return;if(a==='prev')week=shift(week,-7);else if(a==='next')week=shift(week,7);else if(a==='today')week=friday(new Date());else if(a==='week')weekAll=!weekAll;else if(a==='going')onlyGoing=!onlyGoing;else if(a==='new-event')return openEvent();else if(a==='new-for')return openEvent(null,id);else if(a==='edit-event')return openEvent(id);else if(a==='new-person')return openPerson();else if(a==='edit-person')return openPerson(id);else if(a==='attend'){const ev=db.events.find(x=>x.id===id);if(ev){ev.attend=ev.attend==='si'?'sin_decidir':'si';save();toast(ev.attend==='si'?'Partido seleccionado':'Selección eliminada')}return}else if(a==='export')return download();else if(a==='import')return $('#importFile').click();else if(a==='reset'){if(confirm('¿Restaurar los datos iniciales? Se perderán los cambios locales.')){db=JSON.parse(JSON.stringify(seed));save();toast('Datos restaurados')}return}else return;render()});render();
</script><script src="calendario-demo.js?v=1.3"></script><script src="calendario-real.js?v=1.3"></script></body></html>
